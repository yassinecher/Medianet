# ─────────────────────────────────────────────────────────────────────────────
# DEV / BUILD compose — builds every image locally and runs the full stack.
#
# Secrets are NOT hard-coded here: they come from a git-ignored `.env` (see
# `.env.example`). Copy it to `.env` and fill in the real values BEFORE running:
#     cp .env.example .env
#     docker compose up -d --build
#
# Attack surface: only the API gateway (8080), the two front-ends (3000/3001)
# and MinIO (9000/9001, serves public images) publish to the host. Everything
# else is reachable only inside `medianet-network` by container name.
#
# Production runs docker-compose.prod.yml (image-pull, no build).
# ─────────────────────────────────────────────────────────────────────────────

# Restart every long-running service unless it was explicitly stopped.
x-restart: &restart
  restart: unless-stopped

# Readiness healthcheck for the Spring services (needs spring-boot-actuator).
# `$$PORT` is filled per service. BusyBox wget ships in the temurin-alpine image.
x-spring-health: &spring-health
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 90s

services:
  # ── Data tier: one Postgres per service (internal only) ────────────────────
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-medianet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
    expose: ["5432"]
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianet} -d ${POSTGRES_AUTH_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-candidature:
    image: postgres:15-alpine
    container_name: postgres-candidature
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_CANDIDATURE_DB:-candidature_db}
      POSTGRES_USER: ${POSTGRES_USER:-medianet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
    expose: ["5432"]
    volumes:
      - postgres_candidature_data:/var/lib/postgresql/data
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianet} -d ${POSTGRES_CANDIDATURE_DB:-candidature_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_NOTIFICATION_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-medianet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
    expose: ["5432"]
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianet} -d ${POSTGRES_NOTIFICATION_DB:-notification_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-programme:
    image: postgres:15-alpine
    container_name: postgres-programme
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_PROGRAMME_DB:-programme_db}
      POSTGRES_USER: ${POSTGRES_USER:-medianet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
    expose: ["5432"]
    volumes:
      - postgres_programme_data:/var/lib/postgresql/data
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianet} -d ${POSTGRES_PROGRAMME_DB:-programme_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-admin-ai:
    image: postgres:15-alpine
    container_name: postgres-admin-ai
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_AI_DB:-admin_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-medianet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
    expose: ["5432"]
    volumes:
      - postgres_admin_ai_data:/var/lib/postgresql/data
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianet} -d ${POSTGRES_ADMIN_AI_DB:-admin_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO: S3-compatible object storage for photos, logos, pitch videos ────
  # Legitimately publishes 9000/9001 — it serves the public image URLs in dev.
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-04-22T22-12-26Z}
    container_name: medianet-minio
    <<: *restart
    ports:
      - "9000:9000"   # S3 API (public images)
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medianet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medianet2024}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Run once on startup: create the bucket + set public-read policy on it.
  minio-setup:
    image: minio/mc:${MC_IMAGE_TAG:-RELEASE.2025-04-16T18-13-26Z}
    container_name: medianet-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until (mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-medianet} ${MINIO_ROOT_PASSWORD:-medianet2024}) do echo 'waiting for minio…'; sleep 2; done;
        mc mb -p local/${MINIO_BUCKET:-medianet} || true;
        mc anonymous set download local/${MINIO_BUCKET:-medianet} || true;
        echo '✓ MinIO bucket ready (public read)';
        exit 0;
      "
    networks:
      - medianet-network
    restart: "no"

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  # NOTE: currently VESTIGIAL — auth/candidature carry the AMQP starter + config
  # but no code publishes or consumes events yet. Kept (internal only) so their
  # health indicator stays green; remove this + SPRING_RABBITMQ_* + the AMQP
  # starter if the report doesn't describe an async-messaging story.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: medianet-rabbitmq
    <<: *restart
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medianet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-medianet2024}
    expose: ["5672", "15672"]
    networks:
      - medianet-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Ollama (local LLM) — OPTIONAL & heavy. Off unless the `ai-local` profile
  # is enabled: `docker compose --profile ai-local up`. admin-ai defaults to the
  # HuggingFace provider, so the core AI works without this. On a CPU-only host,
  # leave the GPU `deploy` block commented (below).
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.7}
    container_name: ollama
    <<: *restart
    profiles: ["ai-local"]
    expose: ["11434"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    networks:
      - medianet-network
    deploy:
      resources:
        limits:
          memory: 4g
        # GPU passthrough — requires the NVIDIA Container Toolkit. Comment this
        # `reservations` block out on a CPU-only host (Whisper runs on CPU).
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        OLLAMA_PID=$$!;
        until ollama list > /dev/null 2>&1; do sleep 2; done;
        ollama pull ${OLLAMA_MODEL:-llama3.2};
        wait $$OLLAMA_PID
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q ${OLLAMA_MODEL:-llama3.2}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Self-hosted pitch video analysis: ffmpeg + faster-whisper (CPU) + optional
  # Ollama vision. Called by admin-ai-service.
  pitch-media-service:
    build: ./backend/pitch-media-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-pitch-media-service:${TAG:-latest}
    container_name: pitch-media-service
    <<: *restart
    expose: ["8087"]
    environment:
      MINIO_PUBLIC_URL:   ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_INTERNAL_URL: http://minio:9000
      OLLAMA_URL:         http://ollama:11434
      WHISPER_MODEL:      ${WHISPER_MODEL:-base}
      WHISPER_DEVICE:     cpu
      WHISPER_COMPUTE:    int8
      # Vision needs Ollama (enable the `ai-local` profile). Empty = transcription only.
      VISION_MODEL:       ${PITCH_VISION_MODEL:-}
      FRAME_COUNT:        "3"
      WHISPER_BEAM:       "1"
    volumes:
      - whisper_models:/models
    networks:
      - medianet-network
    deploy:
      resources:
        limits:
          memory: 1600m

  # ── Service discovery ──────────────────────────────────────────────────────
  eureka-server:
    build: ./backend/eureka-server
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-eureka-server:${TAG:-latest}
    container_name: eureka-server
    <<: *restart
    expose: ["8761"]
    environment:
      JAVA_TOOL_OPTIONS: ${EUREKA_JAVA_OPTS:--Xmx256m}
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      <<: *spring-health

  # ── Business microservices (internal only — reached via the gateway) ───────
  auth-service:
    build: ./backend/auth-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-auth-service:${TAG:-latest}
    container_name: auth-service
    <<: *restart
    expose: ["8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${POSTGRES_AUTH_DB:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medianet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-medianet}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-medianet2024}
      # Don't tie service health to the (vestigial) broker.
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      EUREKA_URI: http://eureka-server:8761/eureka
      JAVA_TOOL_OPTIONS: ${AUTH_JAVA_OPTS:--Xmx320m}
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      <<: *spring-health

  candidature-service:
    build: ./backend/candidature-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-candidature-service:${TAG:-latest}
    container_name: candidature-service
    <<: *restart
    expose: ["8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-candidature:5432/${POSTGRES_CANDIDATURE_DB:-candidature_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medianet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-medianet}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-medianet2024}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      AUTH_SERVICE_URL: http://auth-service:8081
      PROGRAMME_SERVICE_URL: http://programme-service:8086
      EUREKA_URI: http://eureka-server:8761/eureka
      JAVA_TOOL_OPTIONS: ${CANDIDATURE_JAVA_OPTS:--Xmx320m}
    depends_on:
      postgres-candidature:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      <<: *spring-health

  notification-service:
    build: ./backend/notification-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-notification-service:${TAG:-latest}
    container_name: notification-service
    <<: *restart
    expose: ["8087"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/${POSTGRES_NOTIFICATION_DB:-notification_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medianet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:-yassinecherni9@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Medianet Incubateur}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EUREKA_URI: http://eureka-server:8761/eureka
      JAVA_TOOL_OPTIONS: ${NOTIFICATION_JAVA_OPTS:--Xmx320m}
    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/actuator/health || exit 1"]
      <<: *spring-health

  programme-service:
    build: ./backend/programme-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-programme-service:${TAG:-latest}
    container_name: programme-service
    <<: *restart
    expose: ["8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-programme:5432/${POSTGRES_PROGRAMME_DB:-programme_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medianet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EUREKA_URI: http://eureka-server:8761/eureka
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-medianet}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-medianet2024}
      MINIO_BUCKET: ${MINIO_BUCKET:-medianet}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 2GB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 2GB
      CANVA_CLIENT_ID: ${CANVA_CLIENT_ID:-}
      CANVA_CLIENT_SECRET: ${CANVA_CLIENT_SECRET:-}
      CANVA_REDIRECT_URI: ${CANVA_REDIRECT_URI:-http://127.0.0.1:8080/api/canva/callback}
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: "-1"
      # Uploads stream to disk, so a modest heap is fine.
      JAVA_TOOL_OPTIONS: ${PROGRAMME_JAVA_OPTS:--Xmx512m}
    depends_on:
      postgres-programme:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8086/actuator/health || exit 1"]
      <<: *spring-health

  admin-ai-service:
    build: ./backend/admin-ai-service
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-admin-ai-service:${TAG:-latest}
    container_name: admin-ai-service
    <<: *restart
    expose: ["8088"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-admin-ai:5432/${POSTGRES_ADMIN_AI_DB:-admin_ai_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medianet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medianet2024}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EUREKA_URI: http://eureka-server:8761/eureka
      HF_TOKEN:     ${HF_TOKEN:-}
      LLM_MODEL:    ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_APP_NAME: "Medianet Incubateur"
      PROGRAMME_SERVICE_URL:    http://programme-service:8086
      AUTH_SERVICE_URL:         http://auth-service:8081
      CANDIDATURE_SERVICE_URL:  http://candidature-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      PITCH_MEDIA_SERVICE_URL:  http://pitch-media-service:8087
      JAVA_TOOL_OPTIONS: ${ADMIN_AI_JAVA_OPTS:--Xmx448m}
    depends_on:
      postgres-admin-ai:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/actuator/health || exit 1"]
      <<: *spring-health

  # ── Edge: the ONLY backend port published to the host ──────────────────────
  api-gateway:
    build: ./backend/api-gateway
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-api-gateway:${TAG:-latest}
    container_name: api-gateway
    <<: *restart
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      # Serves public uploads (/<bucket>/**) from the same API domain.
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-medianet}
      JAVA_TOOL_OPTIONS: ${GATEWAY_JAVA_OPTS:--Xmx320m}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - medianet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      <<: *spring-health

  nextjs-frontoffice:
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-frontoffice:${TAG:-latest}
    build:
      context: ./frontend/nextjs-frontoffice
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: nextjs-frontoffice
    <<: *restart
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - medianet-network

  nextjs-backoffice:
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-backoffice:${TAG:-latest}
    build:
      context: ./frontend/nextjs-backoffice
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
    container_name: nextjs-backoffice
    <<: *restart
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - medianet-network

  # Reverse proxy — only used in production (docker-compose.prod.yml). Behind the
  # "proxy" profile so `docker compose up` in dev doesn't start it; still built &
  # pushed via `docker compose --profile proxy build|push`.
  nginx:
    profiles: ["proxy"]
    build: ./nginx
    image: ${DOCKER_USERNAME:-yassinecherni9}/medianet-nginx:${TAG:-latest}
    container_name: nginx
    networks:
      - medianet-network

networks:
  medianet-network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_candidature_data:
  postgres_notification_data:
  postgres_programme_data:
  postgres_admin_ai_data:
  ollama_data:
  minio_data:
  whisper_models:
